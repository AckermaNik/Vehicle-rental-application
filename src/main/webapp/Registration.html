<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nikoleta">
    <meta name="description" content="Registration form">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/registration.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<!--    <script src="js/code.js"></script>
-->  <script src="js/ajax.js"></script>
    <title>Registration form</title>
</head>
<body>

    <div class="top">
        <header id="title">
            <h1>Registration Form</h1>
        </header>
       
    </div>

    <div class="container">
        <div class="grid">
            <form id="myForm"  name="myForm" action="Registration" method="POST">

                <br>
                <label for="username">* Username</label>
                <input type="text" id="username" name="username" placeholder="px.Nikolet@(only up to 30 chars long)"  pattern="{1,30}" required onchange="validateUsername();return false">
                <div id="username_error"></div>
                <div id="errorMes2"></div> <!-- for checking -->
                <br>
                <br>
                <label for="f_name">* First Name</label>
                <input type="text" id="f_name" name="f_name" placeholder="px.Nikoleta" pattern="[A-Za-z]{1,30}" required>
                <br>
                <br>
                <label for="l_name">* Last Name</label>
                <input type="text" id="l_name" name="l_name" placeholder="px.Xenaki" pattern="[A-Za-z]{1,30}" required>
                <br>
                <br>
                <label for="birthdate">* Birth date</label>
                <input type="date" id="birthdate" name="birthdate" value="1980-01-01">
                <br>
                <br>
                <label for="address">* Address</label>
                <input type="text" id="address" name="address"  pattern=".{1,40}" required>
                <br>
                <br>
                <label for="card_no">*Credit Card Number </label>
                <input type="text" id="card_no" name="card_no" pattern="\d{16,20}" required>
                <br>
                <br>
                <label for="driver_lic_no">*Drivers License Number</label>
                <input type="text" id="driver_lic_no" name="driver_lic_no" pattern="^[A-Z]{2}\w{8,10}$" required>
                <br>
                <br>
                <p id="endphrase">The fields with the symbol "*" are mandatory!!</p>
                <input type="submit" value="Registration" id="submit_button">
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script
    src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<!--    <script src="js/code.js"></script>
    <script src="js/ajax.js"></script>-->
</body>
</html>
