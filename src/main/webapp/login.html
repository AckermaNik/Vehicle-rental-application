<body>
    <div class="top">
        <header id="title">
         <h1>Login</h1>
        </header>
    </div>
    <div class="container">
        <form action="LoginServlet" method="post">
            <label for="username">Username</label><br><br>
            <input type="text" id="username" name="username"  pattern=".{1,30}" required>

            <br>
            <input type="submit" value="Login">
