    <title>Rental duration statistics</title>

<body>



    <div class="header-container">
        <div class="top">
            <header id="title">
                <h1>Rental duration statistics</h1>
            </header>
        </div>
    </div>



    <div class="blank-middle"></div>


    <div class="container">
        <div class="grid">
            <form id="myM_P_Form"  name="myM_P_Form" action="GetRentalStats" method="POST">
                <label for="rent_stats_car">Rental durations for cars:</label>
                <input type="text" id="rent_stats_car" name="rent_stats_car" readonly><br>

                <label for="rent_stats_motorbike">Rental durations for motorbikes:</label>
                <input type="text" id="rent_stats_motorbike" name="rent_stats_motorbike" readonly><br>

                <label for="rent_stats_bike">Rental durations for bikes:</label>
                <input type="text" id="rent_stats_bike" name="rent_stats_bike" readonly><br>

                <label for="rent_stats_scooter">Rental durations for scooters:</label>
                <input type="text" id="rent_stats_scooter" name="rent_stats_scooter" readonly><br>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script
    src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script>

    document.addEventListener('DOMContentLoaded', function () {

        showRentalStats();
