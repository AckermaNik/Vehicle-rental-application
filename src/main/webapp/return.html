<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Nikoleta">
        <meta name="description" content="Registration form">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" type="text/css" href="css/registration.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
        <!--    <script src="js/code.js"></script>
        -->  <script src="js/ajax.js"></script>
        <title>Return Submission</title>
    </head>
    <body>

        <div class="top">
            <header id="title">
                <h1>Return Submission</h1>
            </header>

        </div>

        <div class="container">
            <div class="grid">
                <form id="myForm"  name="myForm" action="ReturnAction" method="POST">

                    <br>

                    <label for="returndate">Date the vehicle is returned: </label>
                    <input type="date" id="returndate" name="returndate" required>
                    <br>
                    <br>
                    <label for="returnhour">Hour the vehicle is returned: </label>
                    <input type="time" id="returnhour" name="returnhour" required value="10:30">
                    <br>

                    <label for="rented"> Vehicle to be returned: </label>
                    <input type="button" id="rented" name="rented" value="Show rented vehicles" onclick="getRented();return false">
                    <div id="rentedvehs"></div>


                    <br>
                    <input type="submit" value="Return" id="submit_button">
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
        <script
        src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
        <!--    <script src="js/code.js"></script>
            <script src="js/ajax.js"></script>-->
    </body>
</html>
