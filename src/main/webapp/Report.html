<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Dimitris">
    <meta name="description" content="Incident report">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/report.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<!--    <script src="js/code.js"></script>
    <script src="js/ajax.js"></script>-->
    <title>Incident report</title>
</head>
<body>



    <div class="header-container">
        <div class="top">
            <header id="title">
                <h1>Incident submission</h1>
            </header>
        </div>
    </div>



    <div class="blank-middle"></div>


    <div class="container">
        <div class="grid">
            <h2>Select the type of your submission:</h2>
            <form id="myReportForm"  name="myReportForm" action="Incident" method="POST">
                <select id="reportDropdown" name="chosenReport">
                    <option value="malfunctionreport">Malfunction</option>
                    <option value="accidentreport">Accident</option>
                    <option value="servicerequest">Service</option>
                    <option value="maintainancerequest">Maintenance</option>
                </select>
                <label for="reg_no">* Vehicle ID</label>
                <input type="text" id="reg_no" name="reg_no" pattern="\w{1,40}" required>
                <br>
                <br>
                <label for="incident_date">* Incident date</label>
                <input type="date" id="incident_date" name="incident_date" value="2024-01-03">
                <br>
                <br>
                <input type="submit" value="Submit" id="submit_button">
                <input type="submit" value="Cancel" id="cancel_button">
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script
    src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
<!--    <script src="js/code.js"></script>
    <script src="js/ajax.js"></script>-->
</body>
</html>
