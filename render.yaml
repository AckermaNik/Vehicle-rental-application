services:
  - type: web
    name: vehicle-rental
    runtime: docker
    healthCheckPath: /index.html
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: HY360_2023
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ENABLE_DB_INIT
        value: "false"
